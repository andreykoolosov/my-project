name: my-app-project

services:
  backend:
    build: .
    container_name: my-backend-container
    volumes:
      - .:/code
    ports:
      - "8080:8000"
    env_file:
      - .env
    networks:
      - app-network

  db:
    image: postgres:15
    container_name: pg-container
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
